name: ci-golang-workflow
# on: [psuh]
# on: [pull_request]

on:
  pull_request:
    branches:
      - developer

jobs:
  check-application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', '1.15']
    steps:
      - uses: actions/checkout@v4 # Acttions "checkout" baixa os arquivos do github
      - uses: actions/setup-go@v5 # Pega o ambiente da maquina e bota o go para funcionar
        with:
          go-version: ${{matrix.go}}
      - run: go test
      - run: go run math.go
